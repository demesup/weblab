<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Space Exploration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scene">
        <div class="planet">
            <div class="crater"></div>
            <div class="crater"></div>
            <div class="crater"></div>
            <div class="crater"></div>
            <div class="crater"></div>
            <div class="rover">
                <div class="body"></div>
                <div class="wheels"></div>
                <div class="trace"></div>
            </div>
            <div class="flag">404</div>
        </div>
        <div class="message">
            <p>
                There is no life, try to find <a href="https://codepen.io/ddly/">something else</a>
            </p>
            <div class="search-box">
                <input type="text" placeholder="Tell me what you were looking for, lost soul..." id="soul-search">
                <button type="button" id="search-btn">Transmit</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
